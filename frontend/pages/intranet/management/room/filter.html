<div class="row mb-3">
	<div class="col">
		<label class="form-label" for="schoolId">School</label>
		<select
			name="schoolId"
			id="schoolId"
			data-load-source="{{select:url:short}}/school"
			required
		></select>
	</div>
</div>

<div class="row mb-3">
	<div class="col">
		<label class="form-label" for="buildingId">Gebouw</label>
		<select
			name="buildingId"
			id="buildingId"
			data-load-source="{{select:url:short}}/{{url:part.module}}/building"
			data-parent-select="schoolId"
			required
		></select>
	</div>
</div>
