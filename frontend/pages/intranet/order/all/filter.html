<div class="row mb-3">
	<div class="col">
		<label class="form-label mb-1" for="schoolId">School</label>
		<select
			name="schoolId"
			id="schoolId"
			data-load-source="{{select:url:short}}/school"
			multiple
		></select>
	</div>
</div>

<div class="row mb-3">
	<div class="col">
		<label class="form-label mb-1" for="status">Status</label>
		<select
			name="status"
			id="status"
			data-load-source="{{select:url:short}}/{{url:part.module}}/status"
			data-default-value="N;QR;QA;WA;A;D;S;R;PR;O"
			multiple
		></select>
	</div>
</div>
