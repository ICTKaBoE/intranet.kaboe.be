<div class="row mb-3">
	<div class="col">
		<label class="form-label" for="schoolId">School</label>
		<select
			name="schoolId"
			id="schoolId"
			data-load-source="{{select:url:short}}/school"
			data-default-value="{{user:mainSchoolId}}"
			required
		></select>
	</div>
</div>

<div class="row mb-3">
	<div class="col">
		<label class="form-label" for="authorId">Auteur</label>
		<select
			name="authorId"
			id="authorId"
			data-load-source="{{select:url:short}}/{{url:part.module}}/author"
			data-search
			multiple
			required
		></select>
	</div>
</div>

<div class="row mb-3">
	<div class="col">
		<label class="form-label" for="categoryId">Categorie</label>
		<select
			name="categoryId"
			id="categoryId"
			data-load-source="{{select:url:short}}/{{url:part.module}}/category"
			data-search
			multiple
			required
		></select>
	</div>
</div>
