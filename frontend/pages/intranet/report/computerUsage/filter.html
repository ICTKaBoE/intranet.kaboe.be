<div class="row mb-3">
	<div class="col">
		<label class="form-label" for="schoolId">School</label>
		<select
			name="schoolId"
			id="schoolId"
			data-load-source="{{select:url:short}}/school"
			data-default-value="{{user:mainSchoolId}}"
		></select>
	</div>
</div>

<div class="row mb-3">
	<div class="col">
		<label for="schoolyear" class="form-label">Schooljaar</label>
		<input
			type="text"
			name="schoolyear"
			id="schoolyear"
			value="{{schoolyear}}"
			class="form-control"
			data-mask="0000-00"
		/>
	</div>
</div>

<div class="row mb-3">
	<div class="col">
		<label for="type" class="form-label">Type</label>
		<select name="type" id="type">
			<option value="%LLN%">Leerlingenlaptop</option>
			<option value="%PER%">Personeelslaptop</option>
			<option value="%PC%">Vaste computer</option>
		</select>
	</div>
</div>
