<div class="row mb-3">
  <div class="col">
    <label class="form-label mb-1" for="schoolyearId">Schooljaar</label>
    <select
      name="schoolyearId"
      id="schoolyearId"
      data-load-source="{{select:url:short}}/general/schoolyear"
      data-default-value="{{schoolyear:default.id}}"
    ></select>
  </div>
</div>

<div class="row mb-3">
  <div class="col">
    <label class="form-label mb-1" for="schoolId">School</label>
    <select
      name="schoolId"
      id="schoolId"
      data-load-source="{{select:url:short}}/school"
    ></select>
  </div>
</div>
